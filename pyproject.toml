[project]
name = "system-one-code-review"
version = "0.1.0"
description = "How well System One models review pull requests, starting with TypeSafe's Jev on SWR-Bench."
authors = [
    { name = "luc-pimentel", email = "154371376+luc-pimentel@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
]

[project.scripts]
s1cr = "s1cr.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "s1cr"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
